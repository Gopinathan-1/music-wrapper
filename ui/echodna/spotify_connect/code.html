<style>
        body {
            background-color: #131313;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .aurora-gradient {
            background: radial-gradient(circle at 20% 30%, rgba(83, 224, 118, 0.15) 0%, transparent 50%),

                        radial-gradient(circle at 50% 50%, rgba(0, 219, 233, 0.05) 0%, transparent 70%);
        }

            background: linear-gradient(to top, var(--tw-primary), transparent);
            width: 4px;
            border-radius: 2px;
            transition: height 0.5s ease-in-out;
        }

<body class="min-h-screen flex items-center justify-center relative font-body-md text-on-background">
<!-- Background Elements -->
<div class="fixed inset-0 aurora-gradient z-0"></div>
<!-- Subtle Visualizer Background -->
<div class="fixed bottom-0 left-0 right-0 h-64 flex items-end justify-center gap-1 opacity-20 z-0 px-4">
<div class="equalizer-bar" style="height: 40%"></div>
<div class="equalizer-bar" style="height: 60%"></div>
<div class="equalizer-bar" style="height: 30%"></div>
<div class="equalizer-bar" style="height: 80%"></div>
<div class="equalizer-bar" style="height: 50%"></div>
<div class="equalizer-bar" style="height: 90%"></div>
<div class="equalizer-bar" style="height: 40%"></div>
<div class="equalizer-bar" style="height: 70%"></div>
<div class="equalizer-bar" style="height: 20%"></div>
<div class="equalizer-bar" style="height: 55%"></div>
<div class="equalizer-bar" style="height: 85%"></div>
<div class="equalizer-bar" style="height: 35%"></div>
<div class="equalizer-bar" style="height: 65%"></div>
</div>
<!-- Main Content Shell (No Nav for Transactional Flow) -->
<main class="relative z-10 w-full max-w-lg px-container-margin flex flex-col items-center">
<!-- Header / Identity -->
<div class="mb-12 text-center">
<h1 class="font-display-xl text-headline-lg text-primary tracking-tighter mb-2">EchoDNA</h1>
<p class="font-label-caps text-on-surface-variant tracking-widest">GENETIC MUSIC ANALYSIS</p>
</div>
<!-- Glassmorphism Login Card -->
<div class="glass-card w-full p-10 rounded-[32px] flex flex-col items-center shadow-2xl relative overflow-hidden">
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-primary/50 to-transparent"></div>
<div class="mb-8 p-4 bg-primary/10 rounded-full">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">
                    biotech
                </span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-4 text-center">Unlock Your Identity</h2>
<p class="font-body-md text-on-surface-variant text-center mb-10 max-w-[280px]">
                We only analyze your listening habits. Never your personal data.
            </p>
<!-- Primary Action -->
<button class="w-full bg-primary hover:bg-primary-fixed transition-all duration-300 py-5 rounded-full flex items-center justify-center gap-3 group shadow-[0_0_30px_rgba(83,224,118,0.2)] active:scale-[0.98]">
<span class="material-symbols-outlined text-on-primary text-[24px]">
                    brand_family
                </span>
<span class="font-headline-md text-on-primary text-body-lg font-bold">Connect with Spotify</span>
</button>
<!-- Trust Indicators -->
<div class="mt-10 grid grid-cols-2 gap-4 w-full border-t border-white/10 pt-8">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-[18px]">
                            shield_lock
                        </span>
</div>
<span class="font-label-caps text-[10px] text-on-surface-variant">SECURE API</span>
</div>
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary text-[18px]">
                            visibility_off
                        </span>
</div>
<span class="font-label-caps text-[10px] text-on-surface-variant">PRIVACY FIRST</span>
</div>
</div>
</div>
<!-- Footer Meta -->
<div class="mt-8 flex flex-col items-center gap-4">
<div class="flex gap-6">
<a class="font-label-caps text-[11px] text-outline hover:text-primary transition-colors" href="#">PRIVACY POLICY</a>
<a class="font-label-caps text-[11px] text-outline hover:text-primary transition-colors" href="#">DATA ETHICS</a>
</div>
<p class="font-body-md text-[12px] text-outline/50 italic">
                Authorized Spotify Developer Partner
            </p>
</div>
